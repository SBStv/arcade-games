<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asteroids</title>
<style>
:root{--bg:#05070d;--fg:#e8f1ff;--dim:#7d8aa5;--line:#e8f1ff;--accent:#7cffb2;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05070d;--fg:#e8f1ff;--dim:#7d8aa5;--line:#e8f1ff;--accent:#7cffb2}}
:root[data-theme="dark"]{--bg:#05070d;--fg:#e8f1ff;--dim:#7d8aa5;--line:#e8f1ff;--accent:#7cffb2}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:ui-monospace,Menlo,Consolas,monospace}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;touch-action:none;user-select:none;-webkit-user-select:none}
.game-wrap{position:relative;width:min(100vw,calc((100vh - 120px)*4/3));max-width:100%}
canvas{display:block;width:100%;height:auto;aspect-ratio:4/3;background:#000;border:1px solid #1b2436;border-radius:6px}
.pad{display:none;gap:8px;flex-wrap:wrap;justify-content:center}
.pad button{width:52px;height:56px;border-radius:12px;border:1px solid #2a3550;background:#0d1424;color:var(--fg);font:20px inherit}
.pad button:active{background:#1c2a48}
.dev-levels{position:fixed;right:max(10px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:3}
.dev-levels[hidden]{display:none}
.dev-levels button{position:relative;width:38px;height:32px;padding:2px;border:1px solid #2a3550;border-radius:6px;background:#0d1424;color:var(--fg);font:12px ui-monospace,Menlo,Consolas,monospace;cursor:pointer;touch-action:manipulation}
.dev-levels button canvas{width:32px;height:24px;border:0;border-radius:0}
.dev-levels button span{position:absolute;right:1px;bottom:0;padding:0 2px;border-radius:3px;background:#16213a;color:var(--accent);font-size:10px;line-height:12px}
.dev-levels button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{color:var(--dim);font-size:12px;text-align:center;padding:0 12px}
.entry{display:none;position:absolute;align-items:stretch;gap:3px;z-index:2}.entry input{flex:1;min-width:0;width:0;padding:0 2px;border:1px solid #7cffb2;border-radius:2px;background:#0d1424;color:var(--fg);font:16px ui-monospace,Menlo,Consolas,monospace;text-transform:uppercase;text-align:left;user-select:text;-webkit-user-select:text}.entry button{flex:none;padding:0 2px;border:1px solid #2a3550;border-radius:3px;background:#16213a;color:var(--fg);font:12px ui-monospace,Menlo,Consolas,monospace;cursor:pointer}
.mbtn{background:none;border:1px solid #2a3550;color:var(--dim);border-radius:8px;padding:4px 12px;font-size:12px;font-family:inherit;cursor:pointer}
.home{position:fixed;top:12px;left:12px;z-index:2;padding:7px 10px;border:1px solid #2a3550;border-radius:8px;background:#0d1424;color:var(--fg);font:12px ui-monospace,Menlo,Consolas,monospace;text-decoration:none}
.home:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (pointer:coarse){.pad{display:flex}.hint{display:none}}
@media (max-width:760px){.dev-levels{top:auto;right:10px;bottom:max(86px,env(safe-area-inset-bottom,0px));transform:none;flex-direction:row}}
</style>
</head>
<body>
<a class="home" href="index.html">← Main page</a>

</div>

<div class="hint">← → rotate · ↑ thrust · Space fire · H hyperspace (15s recharge) · B bomb · P pause · M music · Enter start</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=800,H=600,TAU=Math.PI*2;
const keys={};let state='title',paused=false,score=0,lives=3,level=1,nextLife=10000,hi=0,ship,rocks=[],bullets=[],parts=[],ufo=null,ufoT=900,respawn=0,msgT=0;
let devMode=false;
try{hi=+localStorage.getItem('ast_hi')||0}catch(e){}
let ac=null;
function snd(f,d,type,vol,slide){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,ac.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),ac.currentTime+d);g.gain.setValueAtTime(vol||.05,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const R=(a,b)=>a+Math.random()*(b-a);
const stars=Array.from({length:130},()=>({x:R(0,W),y:R(0,H),z:R(.15,1),p:R(0,TAU)}));
function drawStars(){const t=performance.now()/1000,s=(state==='play'&&ship&&respawn<=0)?ship:null;for(const st of stars){st.x=(st.x-(s?s.vx:0)*st.z*.25-.05*st.z+W)%W;st.y=(st.y-(s?s.vy:0)*st.z*.25+H)%H;const a=.25+.55*st.z*(.6+.4*Math.sin(t*2+st.p));ctx.fillStyle='rgba(200,220,255,'+a.toFixed(2)+')';const sz=st.z>.8?2:1;ctx.fillRect(st.x,st.y,sz,sz)}}
// ---- Music: original heroic space-fanfare, synthesized live ----
let musicOn=true,mg=null,mTimer=null,mNext=0,mBar=0,mRun=false;
const mtof=m=>440*Math.pow(2,(m-69)/12),BEAT=60/92;
const PROG=[[38,[62,66,69]],[35,[62,66,71]],[43,[62,67,71]],[45,[61,64,69]],[35,[62,66,71]],[43,[62,67,71]],[45,[61,64,69]],[38,[62,66,69]]];
const MEL=[[[69,1.5],[74,.5],[74,2]],[[78,1],[76,.5],[74,.5],[71,2]],[[71,1.5],[76,.5],[74,1],[71,1]],[[73,1],[76,1],[81,2]],[[78,1.5],[81,.5],[78,1],[74,1]],[[79,1],[78,.5],[76,.5],[74,2]],[[76,1],[73,1],[69,1],[73,1]],[[74,3],[0,1]]];
function mvoice(f,t,d,type,v,cut,att,rel,det){const g=ac.createGain(),fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.setValueAtTime(cut*.4,t);fl.frequency.linearRampToValueAtTime(cut,t+att+.05);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+att);g.gain.setValueAtTime(v,t+Math.max(att,d-rel*.3));g.gain.linearRampToValueAtTime(.0001,t+d+rel);fl.connect(g);g.connect(mg);[-det,det].forEach(c=>{const o=ac.createOscillator();o.type=type;o.frequency.value=f;o.detune.value=c;o.connect(fl);o.start(t);o.stop(t+d+rel+.05)})}
function timp(f,t,v){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(f*1.5,t);o.frequency.exponentialRampToValueAtTime(f,t+.12);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.7);o.connect(g);g.connect(mg);o.start(t);o.stop(t+.75)}
function schedBar(t){const [root,tri]=PROG[mBar%8];
 tri.forEach(m=>mvoice(mtof(m-12),t,4*BEAT,'sawtooth',.018,1100,.7,.9,6));
 mvoice(mtof(root),t,4*BEAT,'triangle',.07,500,.05,.4,0);
 timp(mtof(root),t,.28);timp(mtof(root),t+2*BEAT,.18);
 if(mBar%8===7){for(let i=0;i<4;i++)timp(mtof(root+12),t+(3+i*.25)*BEAT,.08+i*.04)}
 let b=0;MEL[mBar%8].forEach(([m,d])=>{if(m)mvoice(mtof(m),t+b*BEAT,d*BEAT*.95,'sawtooth',.045,2600,.05,.18,5);b+=d});
 mBar++}
function mtick(){if(!mRun||!ac)return;while(mNext<ac.currentTime+.8){mNext+=level===1?schedBar2(mNext):schedBar3(mNext)}}
function startMusic(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();if(mg){try{mg.disconnect()}catch(e){}}mg=ac.createGain();mg.gain.value=musicOn?.55:0;mg.connect(ac.destination);clearInterval(mTimer);mBar=0;mNext=ac.currentTime+.15;mRun=true;mtick();mTimer=setInterval(mtick,150)}catch(e){}}
function stopMusic(){mRun=false;clearInterval(mTimer);try{if(mg)mg.gain.setTargetAtTime(0,ac.currentTime,.5)}catch(e){}}
function pauseMusic(){try{if(ac){paused?ac.suspend():ac.resume()}}catch(e){}}
function toggleMusic(){musicOn=!musicOn;document.getElementById('mus').textContent=musicOn?'♪ Music on':'♪ Music off';try{if(mg)mg.gain.setTargetAtTime(musicOn?.55:0,ac.currentTime,.1)}catch(e){}}
document.getElementById('mus').addEventListener('click',e=>{toggleMusic();e.currentTarget.blur()});
// ---- Power-ups, rockets & hyperspace warp ----
let picks=[],weapon=null,blasts=[],warpT=0;const WT=170,ws=Array.from({length:170},()=>({a:R(0,TAU),r:R(10,520),z:R(.3,1)}));
function dropPick(x,y,src){if(!src)return;lifeDrop(x,y);if(picks.length>=2||Math.random()>(src===1?.7:.3))return;picks.push({x,y,vx:R(-.5,.5),vy:R(-.5,.5),t:pickType(src),l:720,a:0})}
function blast(x,y){const BR=85;boom(x,y,40,6);snd(90,.6,'sawtooth',.1,.3);blasts.push({x,y,l:22});
 for(const r of rocks){if(!r.d&&Math.hypot(r.x-x,r.y-y)<BR+r.r*.5){hitRock(r,2,true)}}
 for(const al of aliens){if(!al.d&&Math.hypot(al.x-x,al.y-y)<BR)hitAlien(al,3)}
 if(ufo&&Math.hypot(ufo.x-x,ufo.y-y)<BR){boom(ufo.x,ufo.y,20,4);addScore(ufo.sm?1000:200);dropPick(ufo.x,ufo.y,1);bombDrop(ufo.x,ufo.y);ufo=null}}
function doWarp(dt){warpT-=dt;const p=1-warpT/WT,k=p<.25?p/.25:p>.8?(1-p)/.2:1;
 for(const s of ws){s.r+=(4+k*34)*s.z*dt;if(s.r>620){s.r=R(5,40);s.a=R(0,TAU)}}
 if(ship){ship.x+=(W/2-ship.x)*.06*dt;ship.y+=(H/2-ship.y)*.06*dt;ship.vx*=.9;ship.vy*=.9;const d=((-Math.PI/2-ship.a+Math.PI)%TAU+TAU)%TAU-Math.PI;ship.a+=d*.08*dt;ship.thr=true;ship.inv=0}updateMinis(dt,false);
 for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt}parts=parts.filter(q=>q.l>0);
 if(warpT<=0){warpT=0;spawnLevel();if(ship){ship.inv=120;ship.thr=false}}}
function drawWarp(){if(warpT<=0)return;const p=1-warpT/WT,k=p<.25?p/.25:p>.8?(1-p)/.2:1,cx=W/2,cy=H/2;ctx.lineCap='round';
 for(const s of ws){const dx=Math.cos(s.a),dy=Math.sin(s.a),len=(4+k*70)*s.z*(.4+s.r/400),r0=Math.max(0,s.r-len);ctx.strokeStyle='rgba(190,220,255,'+(Math.min(1,k*.9+.1)*(.3+.7*s.z)).toFixed(2)+')';ctx.lineWidth=.8+s.z*1.4;ctx.beginPath();ctx.moveTo(cx+dx*r0,cy+dy*r0);ctx.lineTo(cx+dx*s.r,cy+dy*s.r);ctx.stroke()}
 ctx.lineCap='butt';
 const g=ctx.createRadialGradient(cx,cy,0,cx,cy,380);g.addColorStop(0,'rgba(150,190,255,'+(k*.35).toFixed(2)+')');g.addColorStop(1,'rgba(150,190,255,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 if(p>.9){ctx.fillStyle='rgba(220,235,255,'+((p-.9)/.1*.6).toFixed(2)+')';ctx.fillRect(0,0,W,H)}
 ctx.fillStyle='rgba(232,241,255,'+Math.min(1,k*1.5).toFixed(2)+')';ctx.textAlign='center';ctx.font='bold 34px ui-monospace,monospace';ctx.fillText('HYPERSPACE',cx,cy-110);ctx.font='20px ui-monospace,monospace';ctx.fillText('ENTERING WAVE '+level+': '+lvlName(level)[0].toUpperCase(),cx,cy-78)}
let wing=0,minis=[],bumpT=0,aliens=[],alienQ=0,alienT=0;
let shield=0,sflash=0,lifeGiven=false;
// ---- Fast action music: 4 tracks, one per level, rotating every 4 levels ----
const TR=[
{bpm:148,bass:[33,29,36,31],ch:[[57,60,64],[53,57,60],[55,60,64],[55,59,62]],k:[0,4,8,12],s:[4,12],h:2,ld:'sawtooth',mel:[[[76,2],[76,2],[79,2],[81,2],[84,4],[81,2],[79,2]],[[81,2],[81,2],[77,2],[79,2],[81,4],[77,4]],[[79,2],[79,2],[84,2],[83,2],[79,4],[76,4]],[[74,2],[79,2],[83,2],[79,2],[74,2],[79,2],[83,4]]]},
{bpm:160,bass:[38,34,29,36],ch:[[62,65,69],[58,62,65],[57,60,65],[55,60,64]],k:[0,3,6,10,12],s:[4,12],h:2,ld:'square',mel:[[[74,1],[74,1],[77,2],[74,2],[81,4],[79,2],[77,2],[74,2]],[[70,1],[70,1],[74,2],[70,2],[77,4],[74,2],[72,2],[70,2]],[[72,2],[77,2],[81,2],[77,2],[84,4],[81,2],[77,2]],[[76,2],[79,2],[84,2],[79,2],[76,2],[72,2],[76,4]]]},
{bpm:144,bass:[36,31,33,29],ch:[[60,64,67],[59,62,67],[57,60,64],[57,60,65]],k:[0,4,8,12],s:[4,12],h:1,ld:'sawtooth',mel:[[[72,2],[76,2],[79,4],[84,4],[83,2],[79,2]],[[74,2],[79,2],[83,4],[86,4],[83,2],[79,2]],[[72,2],[76,2],[81,4],[84,4],[81,2],[76,2]],[[77,2],[81,2],[84,2],[81,2],[77,4],[72,4]]]},
{bpm:156,bass:[31,27,34,29],ch:[[55,58,62],[55,58,63],[58,62,65],[57,60,65]],k:[0,2,6,8,10,14],s:[4,12],h:2,ld:'square',mel:[[[74,2],[79,2],[82,2],[79,2],[74,2],[79,2],[82,4]],[[75,2],[79,2],[82,2],[79,2],[75,2],[79,2],[82,4]],[[77,2],[82,2],[86,2],[82,2],[77,4],[74,2],[77,2]],[[77,2],[81,2],[84,2],[81,2],[77,2],[72,2],[69,4]]]}
];
let nbuf=null,curTr=-1;
function noise(t,d,type,freq,v){if(!nbuf){nbuf=ac.createBuffer(1,ac.sampleRate*.5,ac.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}const s=ac.createBufferSource();s.buffer=nbuf;const f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;const g=ac.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(mg);s.start(t);s.stop(t+d+.02)}
function kick(t){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);g.gain.setValueAtTime(.32,t);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.connect(g);g.connect(mg);o.start(t);o.stop(t+.25)}
function snare(t){noise(t,.14,'highpass',1500,.12)}
function hat(t,open){noise(t,open?.09:.04,'highpass',7000,.04)}
function schedBar2(t){const ti=(level-1)%4,T=TR[ti];if(ti!==curTr){curTr=ti;mBar=0}
 const bpm=T.bpm+Math.min(level-1,8)*2,S=60/bpm/4,b=mBar%8,i=b%4,hi=b>=4?12:0,root=T.bass[i],ch=T.ch[i];
 for(let s=0;s<16;s++){const ts=t+s*S;
  if(s%2===0)mvoice(mtof(root+(s%8===6?12:0)),ts,S*1.8,'sawtooth',.05,700,.01,.05,4);
  mvoice(mtof(ch[[0,1,2,1][s%4]]+(s%8>=4?12:0)),ts,S*.9,'square',.014,1800,.005,.05,3);
  if(T.k.includes(s))kick(ts);if(T.s.includes(s))snare(ts);if(s%T.h===0)hat(ts,s%4===2)}
 let st=0;T.mel[i].forEach(([m,d])=>{const lm=m+hi>93?m:m+hi;mvoice(mtof(lm),t+st*S,d*S*.95,T.ld,.035,3200,.02,.1,5);st+=d});
 mBar++;return 16*S}
// ---- Top 5 scoreboard (saved on this device) ----
let board=[],lastE=null,entryE=null;
try{board=JSON.parse(localStorage.getItem('ast_board')||'[]').filter(x=>x&&typeof x.n==='string'&&+x.s>=0).slice(0,5)}catch(err){board=[]}
if(board.length)hi=Math.max(hi,board[0].s);
const nmEl=document.getElementById('nm'),entryEl=document.getElementById('entry');
function qualifies(s){return s>0&&(board.length<5||s>board[board.length-1].s)}
function endGame(){if(qualifies(score)){state='entry';entryE={n:'',s:score};entryEl.style.display='flex';nmEl.value='';setTimeout(()=>{if(state==='entry'){try{nmEl.focus()}catch(err){}}},50)}}
function submitScore(){if(state!=='entry')return;const n=(nmEl.value||'').replace(/[^A-Za-z0-9 _.!-]/g,'').trim().toUpperCase().slice(0,10)||'PLAYER';lastE={n,s:score};board.push(lastE);board.sort((a,b)=>b.s-a.s);board=board.slice(0,5);entryE=null;try{localStorage.setItem('ast_board',JSON.stringify(board.map(x=>({n:x.n,s:x.s}))))}catch(err){}try{nmEl.blur()}catch(err){}entryEl.style.display='none';state='over'}
nmEl.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter'){e.preventDefault();submitScore()}});
document.getElementById('nmok').addEventListener('click',submitScore);
function positionNameEntry(y,rank){const scale=cv.clientWidth/W;entryEl.style.left=`${(W/2-135)*scale}px`;entryEl.style.top=`${(y+26+rank*22-12)*scale}px`;entryEl.style.width=`${250*scale}px`;entryEl.style.height='24px'}
function drawBoard(y,editing=false){let entries=board;if(editing&&entryE){entries=[...board,entryE].sort((a,b)=>b.s-a.s).slice(0,5);positionNameEntry(y,entries.indexOf(entryE))}ctx.textAlign='center';ctx.fillStyle='#7cffb2';ctx.font='bold 18px ui-monospace,monospace';ctx.fillText('TOP 5',W/2,y);ctx.font='16px ui-monospace,monospace';
 for(let i=0;i<5;i++){const e=entries[i],yy=y+26+i*22;ctx.fillStyle=e?(e===lastE?'#ffd27a':'#e8f1ff'):'#4a5570';ctx.textAlign='right';ctx.fillText((i+1)+'.',W/2-150,yy);ctx.textAlign='left';ctx.fillText(e?(e===entryE?'':e.n):'----------',W/2-135,yy);ctx.textAlign='right';ctx.fillText(e?String(e.s):'-----',W/2+150,yy)}
 ctx.textAlign='center'}
function drawEntry(){ctx.textAlign='center';ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffd27a';ctx.font='bold 38px ui-monospace,monospace';ctx.fillText('NEW HIGH SCORE!',W/2,H/2-110);ctx.fillStyle='#e8f1ff';ctx.font='20px ui-monospace,monospace';ctx.fillText(String(score),W/2,H/2-78);ctx.fillStyle='#7cffb2';ctx.font='16px ui-monospace,monospace';ctx.fillText('Enter your name in the highlighted Top 5 row',W/2,H/2-45);drawBoard(H/2+5,true)}
// ---- Level names ----
const LV=[['Outer Belt','One shot splits a rock into smaller pieces.'],['Debris Field','Colours show how many shots a rock takes.'],['The Red Ships','Red ships hide behind asteroids and fire only now and then.'],['Yellow Alert','More ships and five rock colours. Yellow ships shoot fast.'],['Hard Rain','Armoured rocks are everywhere.'],['Crimson Gauntlet','Stay close to cover and keep moving.'],['The Graveyard','Nothing out here wants to stay dead.'],['Iron Storm','Heavy rocks and heavier fire.'],['Event Horizon','The pull gets stronger.'],['Last Light','Hold the line.']];
function lvlName(n){return LV[n-1]||['Deep Space '+n,'No one has come this far.']}
// ---- 3D wireframe asteroids, shaded & textured ----
let HRc=null;function getHR(){return HRc||(HRc=HC.map(c=>c?[1,3,5].map(i=>parseInt(c.slice(i,i+2),16)):[0,0,0]))}
function mkIco(sub){const t=(1+Math.sqrt(5))/2;let v=[[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],[0,-1,-t],[0,1,-t],[t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]].map(p=>{const l=Math.hypot(p[0],p[1],p[2]);return[p[0]/l,p[1]/l,p[2]/l]});

 if(shield>0&&!(shield<180&&((shield/10)|0)%2)){ctx.textAlign='right';ctx.font='16px ui-monospace,monospace';ctx.fillStyle='#6fb8ff';ctx.fillText('SHIELD '+Math.ceil(shield/60)+'s',W-20,96);ctx.fillRect(W-170,106,150*shield/1200,5);ctx.strokeStyle='#6fb8ff';ctx.lineWidth=1;ctx.strokeRect(W-170,106,150,5);ctx.textAlign='left'}
 ctx.textAlign='center';
 if(state==='title'){ctx.fillStyle='#7cffb2';ctx.font='bold 64px ui-monospace,monospace';ctx.fillText('ASTEROIDS',W/2,H/2-20);ctx.fillStyle='#e8f1ff';ctx.font='20px ui-monospace,monospace';ctx.fillText('Press Enter / tap to start',W/2,H/2+30);drawBoard(H/2+80)}
 if(state==='over'){ctx.fillStyle='#ff7c7c';ctx.font='bold 56px ui-monospace,monospace';ctx.fillText('GAME OVER',W/2,H/2-10);ctx.fillStyle='#e8f1ff';ctx.font='20px ui-monospace,monospace';ctx.fillText('Score '+score+' · Enter / tap to retry',W/2,H/2+34);drawBoard(H/2+80)}
 if(state==='entry')drawEntry();if(paused){ctx.fillStyle='#e8f1ff';ctx.font='bold 40px ui-monospace,monospace';ctx.fillText('PAUSED',W/2,H/2)}
 if(state==='play'&&msgT>0){ctx.fillStyle='rgba(124,255,178,'+Math.min(1,msgT/40)+')';ctx.font='24px ui-monospace,monospace';ctx.fillText('WAVE '+level+' - '+lvlName(level)[0].toUpperCase(),W/2,H/2-80);ctx.font='14px ui-monospace,monospace';ctx.fillText(lvlName(level)[1],W/2,H/2-56)}
}
// demo rocks on title
rocks=[mkRock(150,120,3),mkRock(650,420,3),mkRock(400,500,2),mkRock(600,100,2)];ship=newShip();
renderDevLevels();
let last=performance.now();
function loop(t){const dt=Math.min(3,(t-last)/16.667);last=t;if(state!=='play'){for(const r of rocks){r.x+=r.vx*dt;r.y+=r.vy*dt;r.a+=r.va*dt;wrap(r)}}update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
const map={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',Space:'fire'};
addEventListener('keydown',e=>{if(state==='entry')return;if(map[e.code]||e.code==='Enter'||e.code==='KeyH'||e.code==='KeyP')e.preventDefault();
 if(e.shiftKey&&e.code==='KeyD'&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();if(!e.repeat)toggleDev();return}
 if(map[e.code])keys[map[e.code]]=true;
 if(e.code==='Enter'&&state!=='play')start();
 if(e.code==='Space'&&state!=='play'&&!e.repeat)start();
 if(e.code==='KeyH'&&state==='play')hyper();
 if(e.code==='KeyP'&&state==='play'){paused=!paused;pauseMusic()}
 if(e.code==='KeyM')toggleMusic();
 if(e.code==='KeyB'&&state==='play'&&!paused)useBomb()});
addEventListener('keyup',e=>{if(map[e.code])keys[map[e.code]]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
cv.addEventListener('pointerdown',()=>{if(state!=='play'&&state!=='entry')start()});
document.querySelectorAll('.pad button').forEach(b=>{const k=b.dataset.k;
 b.addEventListener('pointerdown',e=>{e.preventDefault();if(state==='entry')return;if(state!=='play'){start();return}if(k==='hyper')hyper();else if(k==='bomb')useBomb();else keys[k]=true});
 const up=()=>{if(k!=='hyper')keys[k]=false};b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up)});
</script>
