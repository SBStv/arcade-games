<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finn the Frogger</title>
<style>
:root{--bg:#eef3e8;--fg:#17261a;--muted:#566a58;--btn:#d6e2cf;--btn-fg:#17261a;--ban:#2e7d32;--ban-fg:#f4fbef;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a12;--fg:#e2efe0;--muted:#8fa591;--btn:#1f3023;--btn-fg:#e2efe0;--ban:#1d4d26;--ban-fg:#e8f5e2}}
:root[data-theme="dark"]{--bg:#0f1a12;--fg:#e2efe0;--muted:#8fa591;--btn:#1f3023;--btn-fg:#e2efe0;--ban:#1d4d26;--ban-fg:#e8f5e2}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ban);z-index:10}
.banner{width:100%;background:var(--ban);color:var(--ban-fg);text-align:center;padding:14px 16px}
.banner h1{margin:0;font-size:clamp(24px,6vw,34px);font-weight:800}
.wrap{width:100%;max-width:552px;padding:16px;margin:auto 0}
.hud{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:15px;font-variant-numeric:tabular-nums}
.hud span{color:var(--muted)}
.hud b{color:var(--fg)}
canvas{display:block;width:100%;height:auto;aspect-ratio:1;border-radius:10px;touch-action:none;background:#1a5c2a}
.help{margin:10px 0 0;text-align:center;font-size:13px;color:var(--muted)}
.pad{display:none;grid-template-columns:repeat(3,68px);grid-template-rows:repeat(2,56px);gap:8px;justify-content:center;margin-top:14px}
@media (pointer:coarse){.pad{display:grid}}
.pad button{font-size:22px;border:0;border-radius:12px;background:var(--btn);color:var(--btn-fg);touch-action:manipulation}
.pad button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.snd{display:block;margin:10px auto 0;border:0;border-radius:8px;padding:6px 14px;font:inherit;font-size:13px;background:var(--btn);color:var(--btn-fg);cursor:pointer}
.snd:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.levels{position:fixed;right:max(10px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;max-height:80vh;overflow-y:auto;padding:4px}
.levels:empty{display:none}
.lvl-label{font-size:12px;color:var(--muted);text-align:center}
.lv{display:flex;flex-direction:column;align-items:center;gap:3px;width:62px;border:0;padding:2px 0;border-radius:10px;cursor:pointer;background:none;color:var(--fg);flex:none;touch-action:manipulation}
.lv .thumb{position:relative;display:block;line-height:0;border-radius:10px;overflow:hidden;box-shadow:0 0 0 2px var(--ban)}
.lv canvas{display:block;width:48px;height:48px}
.lv .badge{position:absolute;right:2px;bottom:2px;background:var(--ban);color:var(--ban-fg);font:700 12px/1 system-ui,sans-serif;border-radius:6px;padding:2px 5px}
.lv .nm{font-size:10px;line-height:1.15;color:var(--muted);text-align:center}
.lv:disabled{opacity:.45;cursor:default}
.lv:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
@media (max-width:760px){.levels{position:static;transform:none;flex-direction:row;flex-wrap:wrap;justify-content:center;max-height:none;margin-top:10px;padding:0}}
.board{position:relative}
.entry{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88%,360px);background:rgba(10,24,14,.95);color:#e2efe0;border-radius:14px;padding:18px 16px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5);z-index:2}
.entry[hidden]{display:none}
.entry h2{margin:0 0 4px;font-size:20px;color:#7ee05a}
.entry p{margin:0 0 12px;font-size:14px;color:#b8cfb8}
.entry label{display:block;font-size:13px;margin-bottom:6px}
.entry input{width:100%;font:inherit;font-size:18px;text-align:center;padding:10px;border-radius:10px;border:2px solid #3f8f3f;background:#0f1a12;color:#fff}
.entry input:focus-visible{outline:3px solid #7ee05a;outline-offset:2px}
.entry .row{display:flex;gap:8px;margin-top:12px}
.entry button{flex:1;font:inherit;font-size:15px;padding:10px;border:0;border-radius:10px;cursor:pointer;background:#2e7d32;color:#fff}
.entry button.sec{background:#2b3a2e;color:#cfe3cd}
.entry button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.lb{display:none;margin-top:18px;background:var(--btn);color:var(--btn-fg);border-radius:12px;padding:12px 14px}
.lb h2{margin:0 0 4px;font-size:18px}
.lb-top{margin:0 0 8px;font-size:13px;color:var(--muted)}
.lbt{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.lbt th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:2px 4px}
.lbt td{padding:3px 4px;border-top:1px solid rgba(128,128,128,.25);overflow-wrap:anywhere}
.lbt .num{text-align:right}
.lbt th:first-child,.lbt td:first-child{width:2em}
.lbt tr.me td{background:var(--ban);color:var(--ban-fg);font-weight:700}
@media (min-width:1100px){.lb{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);width:250px;margin:0;max-height:90vh;overflow:auto}}
.up{grid-column:2;grid-row:1}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
</style>
</head>
<body>
<header class="banner">
  <h1>Finn the Frogger</h1>
</header>
<div class="wrap">
  <div class="hud">
    <span>Score <b id="score">0</b></span>
    <span>Level <b id="level">1</b></span>
    <span>Lives <b id="lives"></b></span>
    <span>Best <b id="best">0</b></span>
  </div>
  <div class="board">
    <canvas id="g" width="520" height="520" aria-label="Finn the Frogger game board"></canvas>
    <form class="entry" id="entry" hidden autocomplete="off" aria-labelledby="entryh">
      <h2 id="entryh">You made the leaderboard!</h2>
      <p id="entryinfo"></p>
      <label for="nm">Your name or initials (up to 10 characters)</label>
      <input id="nm" type="text" maxlength="10" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
      <div class="row"><button type="submit">Save score</button><button type="button" class="sec" id="skip">Skip</button></div>
    </form>
  </div>
  <div class="levels" id="levels" role="group" aria-label="Start at a higher level"></div>
  <p class="help">Arrow keys or WASD to hop. Swipe or use the buttons on a touch screen.</p>
  <button class="snd" id="snd" type="button">Sound: on</button>
  <div class="pad">
    <button class="up" data-x="0" data-y="-1" aria-label="Hop up">▲</button>
    <button class="left" data-x="-1" data-y="0" aria-label="Hop left">◀</button>
    <button class="down" data-x="0" data-y="1" aria-label="Hop down">▼</button>
    <button class="right" data-x="1" data-y="0" aria-label="Hop right">▶</button>
  </div>
  <section class="lb" id="lb" aria-labelledby="lbh">
    <h2 id="lbh">Leaderboard</h2>
    <p class="lb-top" id="lbtop"></p>
    <table class="lbt">
      <thead><tr><th>#</th><th>Name</th><th class="num">Score</th><th class="num">Level</th></tr></thead>
      <tbody id="lbb"></tbody>
    </table>
  </section>
</div>
<script>
(() => {
const T = 40, COLS = 13, W = T * COLS, H = T * 13;
const cv = document.getElementById('g'), ctx = cv.getContext('2d');
const dpr = Math.min(window.devicePixelRatio || 1, 2);
cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);
const $ = id => document.getElementById(id);
const mod = (a, n) => ((a % n) + n) % n;
const BAYS = [1, 4, 6, 8, 11];

// Sounds, synthesized with Web Audio (no audio files needed)
let muted = false, AC = null;
function audio() {
  if (muted) return null;
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(type, f0, f1, dur, vol, delay = 0, lp = 0) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  let node = o;
  if (lp) { const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; o.connect(f); node = f; }
  node.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, vol, f0, f1) {
  const a = audio(); if (!a) return;
  const t = a.currentTime, n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = buf; f.type = 'lowpass';
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(a.destination); s.start(t);
}
const ribbit = () => { tone('sawtooth', 140, 240, 0.08, 0.14, 0, 800); tone('sawtooth', 190, 360, 0.11, 0.14, 0.1, 800); };
const splash = () => { noise(0.5, 0.28, 5000, 400); tone('sine', 420, 900, 0.09, 0.15, 0.06); tone('sine', 360, 760, 0.08, 0.12, 0.18); };
const hit = () => { noise(0.3, 0.4, 2500, 150); tone('sawtooth', 260, 50, 0.4, 0.2); };
const plop = () => tone('sine', 520, 110, 0.3, 0.18);
const hop = () => tone('sawtooth', 170, 290, 0.07, 0.12, 0, 800);
const chomp = () => { noise(0.15, 0.4, 3000, 300); tone('square', 120, 60, 0.12, 0.2); tone('square', 110, 50, 0.12, 0.2, 0.14); };
const boing = () => { tone('sine', 220, 880, 0.18, 0.18); noise(0.08, 0.2, 4000, 1500); };
const squish = () => { noise(0.35, 0.5, 2200, 150); tone('sine', 260, 70, 0.3, 0.25); };
const oneUp = () => [660, 880, 1320].forEach((f, i) => tone('square', f, f, 0.1, 0.12, i * 0.08, 3000));
const fanfare = () => {
  [[523.25, 0], [659.25, 0.14], [783.99, 0.28]].forEach(([f, d]) => tone('square', f, f, 0.13, 0.14, d, 3500));
  [523.25, 659.25, 783.99, 1046.5].forEach(f => tone('triangle', f, f, 0.9, 0.12, 0.42));
  tone('square', 1046.5, 1046.5, 0.5, 0.14, 0.42, 3500);
  for (let i = 0; i < 6; i++) { const f = 1500 + Math.random() * 1500; tone('sine', f, f * 1.5, 0.12, 0.08, 0.5 + i * 0.1); }
};

// Music: a looping synth track (kick, clap, hats, bass, arpeggio) scheduled with Web Audio
const STEP = 60 / 132 / 4;
const ROOTS = [55, 43.65, 65.41, 49];
const CHORDS = [[440, 523.25, 659.25], [349.23, 440, 523.25], [523.25, 659.25, 783.99], [392, 493.88, 587.33]];
const ARP = [0, 1, 2, 1, 0, 1, 2, 1, 0, 1, 2, 1, 0, 2, 1, 2];
let mus = null, nbuf = null, timer = null, step = 0, nextT = 0;
function mnote(type, f, t, dur, vol, lp) {
  const a = AC, o = a.createOscillator(), g = a.createGain(), lf = a.createBiquadFilter();
  o.type = type; o.frequency.setValueAtTime(f, t);
  lf.type = 'lowpass'; lf.frequency.value = lp;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(lf); lf.connect(g); g.connect(mus); o.start(t); o.stop(t + dur + 0.02);
}
function mkick(t) {
  const a = AC, o = a.createOscillator(), g = a.createGain();
  o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
  g.gain.setValueAtTime(0.8, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
  o.connect(g); g.connect(mus); o.start(t); o.stop(t + 0.22);
}
function mnoise(t, dur, vol, ftype, freq) {
  const a = AC, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = nbuf; f.type = ftype; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(mus); s.start(t); s.stop(t + dur + 0.02);
}
function playStep(s, t) {
  const bar = (s >> 4) & 3, i = s & 15;
  if (i % 4 === 0) mkick(t);
  if (i % 4 === 2) mnoise(t, 0.05, 0.25, 'highpass', 7000);
  else if (i % 2 === 1) mnoise(t, 0.03, 0.08, 'highpass', 9000);
  if (i === 4 || i === 12) mnoise(t, 0.12, 0.35, 'bandpass', 1800);
  if (i % 2 === 0) mnote('sawtooth', ROOTS[bar] * (i === 6 || i === 14 ? 2 : 1), t, STEP * 1.6, 0.35, 500);
  mnote('square', CHORDS[bar][ARP[i]], t, STEP * 0.9, 0.07, 2400);
}
function schedule() {
  if (nextT < AC.currentTime - 0.2) nextT = AC.currentTime + 0.05;
  while (nextT < AC.currentTime + 0.15) { playStep(step, nextT); step = (step + 1) % 64; nextT += STEP; }
}
function startMusic() {
  const a = audio(); if (!a || timer) return;
  if (!mus) { mus = a.createGain(); mus.gain.value = 0.35; mus.connect(a.destination); }
  if (!nbuf) {
    nbuf = a.createBuffer(1, Math.floor(a.sampleRate * 0.3), a.sampleRate);
    const d = nbuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  step = 0; nextT = a.currentTime + 0.05;
  timer = setInterval(schedule, 25);
}
function stopMusic() { clearInterval(timer); timer = null; }

// Levels 1-5; anything higher repeats level 5 and gets a little faster each time
const LEVELS = [
  { name: 'Sunny Meadow', tip: 'A gentle start: logs, turtles and slow traffic', river: 1.0, car: 0.85, croc: 0, amb: 0, sink: false, dark: 0 },
  { name: 'Rush Hour', tip: 'Ambulance ahead: grab its hearts for extra lives', river: 1.05, car: 1.2, croc: 0, amb: 1, sink: false, dark: 0 },
  { name: 'Croc Creek', tip: 'Crocodiles in the river. Lily pads sink in 2 seconds', river: 1.15, car: 1.2, croc: 0.28, amb: 1, sink: true, dark: 0 },
  { name: 'Night Shift', tip: "It's dark out. Watch for headlights", river: 1.2, car: 1.4, croc: 0.35, amb: 1, sink: true, dark: 0.9 },
  { name: 'Frog Fever', tip: 'Everything at once, and fast. Two ambulances!', river: 1.35, car: 1.65, croc: 0.4, amb: 2, sink: true, dark: 0.65 },
];
// Lanes: row, kind, length (tiles), spacing (tiles), speed (tiles/sec, sign = direction)
const LANES = [
  { row: 1, kind: 'log', len: 4, p: 7, v: 1.2 },
  { row: 2, kind: 'turtle', len: 3, p: 5, v: -1.5 },
  { row: 3, kind: 'log', len: 6, p: 10, v: 1.8 },
  { row: 4, kind: 'log', len: 3, p: 6, v: -1.0 },
  { row: 5, kind: 'pad', len: 1, p: 3, v: 0.9 },
  { row: 7, kind: 'car', len: 1, p: 4, v: -1.8, color: '#e74c3c' },
  { row: 8, kind: 'car', len: 1, p: 3.5, v: 2.4, color: '#f1c40f' },
  { row: 9, kind: 'car', len: 1, p: 5, v: -3.0, color: '#9b59b6' },
  { row: 10, kind: 'car', len: 2, p: 6, v: 1.4, color: '#ecf0f1' },
  { row: 11, kind: 'car', len: 3, p: 8, v: -1.2, color: '#e67e22' },
];
LANES.forEach(l => {
  l.w = l.len * T;
  l.n = Math.ceil((COLS + l.len) / l.p);
  l.span = l.n * l.p * T;
  l.xs = Array.from({ length: l.n }, (_, i) => i * l.p * T + l.row * 70);
  if (l.kind === 'pad') l.ps = l.xs.map(() => ({ stand: 0, sink: false, fade: 0, gone: 0, on: false }));
  if (l.kind === 'log') l.cr = l.xs.map((_, i) => i === 1);
  if (l.kind === 'log') l.cs = l.xs.map(() => ({ stand: 0, sink: false, fade: 0, gone: 0, on: false }));
});

let state = 'ready', frog, maxRow, score = 0, lives = 3, level = 1, bays = [], deadT = 0, best = 0, ambs = [];
let pops = [], confetti = [], confettiT = 0, newBest = false, splat = null;
let card = null, entryOpen = false, board = [], lastId = null, pending = null;
const MAXL = 5;
try { best = +localStorage.getItem('frogger-best') || 0; } catch (e) {}
let unlocked = 1;
try { unlocked = Math.max(1, Math.min(99, +localStorage.getItem('frogger-level') || 1)); } catch (e) {}

function updateLeaderboardVisibility() {
  const lb = $('lb');
  lb.style.display = (state === 'over' || entryOpen) ? '' : 'none';
}

function spawn() { frog = { x: 6 * T, row: 12, cd: 0 }; maxRow = 12; }
function hud() {
  $('score').textContent = score;
  $('level').textContent = level;
  $('lives').textContent = lives > 0 ? '♥'.repeat(lives) : '–';
  $('best').textContent = Math.max(best, score);
}
function start(lv = 1) {
  if (entryOpen) return;
  score = 0; lives = 3; level = lv; bays = []; pops = []; confetti = []; confettiT = 0; newBest = false; splat = null; lastId = null;
  setupLevel(); card = { t: 0, dur: 2.2 }; spawn(); state = 'playing'; hud(); renderLevels(); renderBoard(); updateLeaderboardVisibility(); startMusic();
}
function saveBest() {
  if (score > best) { best = score; try { localStorage.setItem('frogger-best', best); } catch (e) {} }
  hud();
}
function die(kind) { if (state !== 'playing') return; state = 'dead'; deadT = 0.8; lives--; if (kind === 'hit') hit(); else if (kind === 'eaten') chomp(); else plop(); hud(); }

function reachTop() {
  const cx = frog.x + T / 2;
  const b = BAYS.find(c => Math.abs(cx - (c * T + T / 2)) < T * 0.6);
  if (b === undefined || bays.includes(b)) return die();
  bays.push(b); score += 50; splash();
  if (bays.length === BAYS.length) { level++; bays = []; score += 200; unlockLevel(level); setupLevel(); card = { t: 0, dur: 2.2 }; }
  spawn();
}

function move(dx, dy) {
  if (state !== 'playing' || splat || card) return;
  const ox = frog.x, orow = frog.row;
  frog.cd = 0;
  frog.x = Math.max(0, Math.min(W - T, frog.x + dx * T));
  frog.row = Math.max(0, Math.min(12, frog.row + dy));
  if (frog.row < maxRow) { maxRow = frog.row; score += 10; }
  if (dy < 0 && frog.row > 0) ribbit();
  else if (frog.row > 0 && (frog.x !== ox || frog.row !== orow)) hop();
  if (frog.row === 0) reachTop();
  hud();
}
function act(dx, dy) { if (state === 'ready' || state === 'over') start(); else move(dx, dy); }

const siren = () => { for (let i = 0; i < 4; i++) tone('sine', i % 2 ? 560 : 760, i % 2 ? 560 : 760, 0.28, 0.1, i * 0.3); };

// Ambulances: warn with a siren and flashing edge, then speed across, weaving between lanes to dodge cars
function updateAmb(dt) { for (const sl of ambs) ambStep(sl, dt); }
function ambStep(sl, dt) {
  if (!sl.a) {
    if (state === 'playing' && (sl.t -= dt) <= 0) {
      const dir = Math.random() < 0.5 ? 1 : -1, row = 7 + (Math.random() * 5 | 0);
      sl.a = { dir, x: dir > 0 ? -80 : W, y: row, to: row, w: 80, wt: 0.3, warn: 1.2, heart: lives < MAXL && Math.random() < 0.35, spared: false };
      siren();
    }
    return;
  }
  const a = sl.a;
  if (a.warn > 0) { a.warn -= dt; return; }
  a.x += a.dir * 7 * T * (1 + Math.max(0, level - 2) * 0.08) * dt;
  const clear = r => {
    const ln = LANES.find(q => q.row === r);
    const lo = a.x - (a.dir < 0 ? 130 : 10), hi = a.x + a.w + (a.dir > 0 ? 130 : 10);
    return ln.xs.every(cx => cx + ln.w < lo || cx > hi);
  };
  a.wt -= dt;
  if (a.wt <= 0 || !clear(a.to)) {
    const opts = [a.to - 1, a.to + 1].filter(r => r >= 7 && r <= 11 && clear(r));
    if (opts.length) { a.to = opts[Math.random() * opts.length | 0]; a.wt = 0.35 + Math.random() * 0.35; }
    else if (a.wt <= 0) a.wt = 0.2;
  }
  a.y += (a.to - a.y) * Math.min(1, dt * 6);
  if (a.heart && state === 'playing' && frog.row >= 7 && frog.row <= 11 && Math.abs(a.y - frog.row) < 0.7) {
    const hb0 = a.dir > 0 ? a.x - 8 : a.x + a.w - 34;

  for (const p of pops) { p.t += dt; p.y -= 36 * dt; }
  pops = pops.filter(p => p.t < 1);
  if (confettiT > 0) { confettiT -= dt; confetti.push(mkConf(false)); }
  for (const c of confetti) {
    c.vy = Math.min(c.vy + 40 * dt, 230);
    c.y += c.vy * dt; c.x += (c.vx + Math.sin(c.ph + c.y / 30) * 40) * dt; c.rot += c.vr * dt;
  }
  confetti = confetti.filter(c => c.y < H + 20);
}
function drawConfetti() {
  for (const c of confetti) {
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
    ctx.fillStyle = c.c; ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
    ctx.restore();
  }
}

function draw() {
  ctx.fillStyle = '#1a5c2a'; ctx.fillRect(0, 0, W, T);
  ctx.fillStyle = '#1c5a99'; ctx.fillRect(0, T, W, 5 * T);
  ctx.fillStyle = '#3f8f3f'; ctx.fillRect(0, 6 * T, W, T);
  ctx.fillStyle = '#2b2f36'; ctx.fillRect(0, 7 * T, W, 5 * T);
  ctx.fillStyle = '#3f8f3f'; ctx.fillRect(0, 12 * T, W, T);
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2; ctx.setLineDash([14, 14]);
  for (let r = 8; r <= 11; r++) { ctx.beginPath(); ctx.moveTo(0, r * T); ctx.lineTo(W, r * T); ctx.stroke(); }
  ctx.setLineDash([]);
  for (const c of BAYS) {
    for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
      ctx.fillStyle = (i + j) % 2 ? '#111' : '#fff';
      ctx.fillRect(c * T + 4 + i * 8, 4 + j * 8, 8, 8);
    }
    if (bays.includes(c)) { ctx.fillStyle = 'rgba(26,92,42,.7)'; ctx.fillRect(c * T + 4, 4, 32, 32); drawFrog(c * T, 0, '#7ee05a'); }
  }
  for (const l of LANES) {
    const y = l.row * T;
    for (const [i, x] of l.xs.entries()) {
      if (l.kind === 'log' && l.cr[i]) {
        drawCroc(x, y, l, i);
      } else if (l.kind === 'log') {
        ctx.fillStyle = '#8a5a2b'; rr(x, y + 7, l.w, T - 14, 8);
        ctx.fillStyle = '#a8743d'; rr(x + 4, y + 11, l.w - 8, 5, 3);
      } else if (l.kind === 'pad') {
        drawPad(x, y, l.ps[i]);
      } else if (l.kind === 'turtle') {
        for (let i = 0; i < l.len; i++) {
          circle(x + i * T + T / 2, y + T / 2, T * 0.38, '#2e9e5b');
          circle(x + i * T + T / 2, y + T / 2, T * 0.22, '#1f7a42');
        }
      } else {
        ctx.fillStyle = l.color; rr(x + 2, y + 6, l.w - 4, T - 12, 6);
        ctx.fillStyle = 'rgba(20,30,40,.8)';
        const fx = l.v > 0 ? x + l.w - T * 0.45 : x + T * 0.15;
        ctx.fillRect(fx, y + 10, T * 0.3, T - 20);
      }
    }
  }
  if (frog) {
    const y = frog.row * T;
    if (state === 'dead' && frog.eaten) {
      // swallowed: draw nothing
    } else if (state === 'dead') {
      drawFrog(frog.x, y, '#e74c3c');
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath();
      ctx.moveTo(frog.x + 10, y + 12); ctx.lineTo(frog.x + T - 10, y + T - 8);
      ctx.moveTo(frog.x + T - 10, y + 12); ctx.lineTo(frog.x + 10, y + T - 8);
      ctx.stroke();
    } else drawFrog(frog.x, y, '#7ee05a');
  }
  if (cfg().dark) drawDark(cfg().dark);
  drawAmb();
  for (const p of pops) {
    ctx.save(); ctx.globalAlpha = 1 - p.t; ctx.textAlign = 'center'; ctx.font = 'bold 22px system-ui, sans-serif';
    ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.fillStyle = '#ff3b5c';
    ctx.strokeText('+1 ♥', p.x, p.y); ctx.fillText('+1 ♥', p.x, p.y);
    ctx.restore();
  }
  if (state === 'ready') banner('Finn the Frogger', 'Press Space or tap to start');
  if (state === 'over') banner(newBest ? 'NEW HIGH SCORE!' : 'GAME OVER', 'Score ' + score + '. Press Space or tap to play again');
  drawSplat();
  drawCard();
  drawConfetti();
}

const KEYS = { ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1], ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0] };
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('.levels, .entry')) return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k in KEYS || k === ' ') e.preventDefault();
  if (e.repeat) return;
  if (state === 'ready' || state === 'over') { if (k === ' ' || k === 'Enter') start(); return; }
  if (card) { if (k === ' ' || k === 'Enter') card = null; return; }
  if (KEYS[k]) move(...KEYS[k]);
});
cv.addEventListener('pointerdown', () => { if (state === 'ready' || state === 'over') start(); else if (card && card.t > 0.4) card = null; });
let sx = 0, sy = 0;
cv.addEventListener('touchstart', e => { const t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
cv.addEventListener('touchend', e => {
  const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  if (Math.abs(dx) > Math.abs(dy)) move(Math.sign(dx), 0); else move(0, Math.sign(dy));
});
document.querySelectorAll('.pad button').forEach(b =>
  b.addEventListener('pointerdown', e => { e.preventDefault(); act(+b.dataset.x, +b.dataset.y); }));

const snd = $('snd');
snd.addEventListener('click', () => {
  muted = !muted; snd.textContent = 'Sound: ' + (muted ? 'off' : 'on'); snd.blur();
  if (muted) stopMusic(); else if (state === 'playing' || state === 'dead') startMusic();
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopMusic(); else if (!muted && (state === 'playing' || state === 'dead')) startMusic();
});

// Leaderboard name entry
let savedName = ''; try { savedName = localStorage.getItem('frogger-name') || ''; } catch (e) {}
const cleanName = v => Array.from(v.replace(/[\u0000-\u001f\u007f]/g, '').trim()).slice(0, 10).join('');
function closeEntry() { $('entry').hidden = true; entryOpen = false; pending = null; updateLeaderboardVisibility(); renderLevels(); }
$('entry').addEventListener('submit', e => {
  e.preventDefault(); if (!pending) return;
  const n = cleanName($('nm').value) || 'Anonymous';
  savedName = n; try { localStorage.setItem('frogger-name', n); } catch (e2) {}
  const rec = { n, s: pending.s, l: pending.l, id: Date.now() };
  board.push(rec); board.sort((a, b) => b.s - a.s || a.id - b.id); board = board.slice(0, 10);
  lastId = rec.id;
  try { localStorage.setItem('frogger-board', JSON.stringify(board)); } catch (e2) {}
  closeEntry(); renderBoard();
});
$('skip').addEventListener('click', closeEntry);
$('nm').addEventListener('keydown', e => { if (e.key === 'Escape') closeEntry(); });

board = loadBoard(); setupLevel(); spawn(); hud(); renderLevels(); renderBoard(); updateLeaderboardVisibility();
let last = 0;
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000 || 0); last = t;
  if (card) { card.t += dt; if (card.t >= card.dur) card = null; }
  else if (splat) { splat.t += dt; if (splat.t >= splat.dur) splat = null; }
  else update(dt);
  fx(dt); draw(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
