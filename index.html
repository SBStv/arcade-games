<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2e7d32">
  <meta name="description" content="Play Tadpole Hop, Finn the Frogger, and Asteroids, three classic-style arcade games.">
  <title>Arcade Games — Tadpole Hop, Finn the Frogger, and Asteroids</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #eef3e8;
      color: #17261a;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at 50% 0%, #d7edcf, #eef3e8 65%);
    }
    main {
      width: min(100%, 620px);
      padding: clamp(28px, 7vw, 56px);
      border: 1px solid #c8d8c2;
      border-radius: 24px;
      background: rgba(255, 255, 255, .76);
      box-shadow: 0 20px 60px rgba(23, 38, 26, .12);
      text-align: center;
    }
    .frog { font-size: clamp(52px, 12vw, 76px); line-height: 1; }
    h1 { margin: 18px 0 10px; font-size: clamp(34px, 8vw, 54px); line-height: 1.05; }
    p { max-width: 440px; margin: 0 auto; color: #566a58; font-size: 17px; line-height: 1.65; }
    h2 { margin: 28px 0 14px; font-size: 20px; }
    .games {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }
    .play {
      display: inline-flex;
      min-width: 154px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 18px;
      border-radius: 12px;
      background: #2e7d32;
      color: #fff;
      font-weight: 750;
      font-size: 16px;
      text-decoration: none;
      box-shadow: 0 5px 0 #205b24;
      transition: transform .15s, box-shadow .15s, background .15s;
    }
    .play svg { width: 28px; height: 28px; flex:none; }
    .play:hover { background: #256b2a; transform: translateY(2px); box-shadow: 0 3px 0 #205b24; }
    .play:focus-visible { outline: 3px solid #17261a; outline-offset: 4px; }
    .how-to { margin-top: 24px; font-size: 14px; }
    @media (prefers-color-scheme: dark) {
      :root { background: #0f1a12; color: #e2efe0; }
      body { background: radial-gradient(ellipse at 50% 0%, #1d3821, #0f1a12 65%); }
      main { background: rgba(25, 43, 29, .88); border-color: #35523a; }
      p { color: #a7b9a8; }
      .play:focus-visible { outline-color: #e2efe0; }
    }
  </style>
</head>
<body>
  <main>
    <div class="frog" aria-hidden="true">🐸</div>
    <h1>Arcade Games</h1>
    <p>Choose an arcade challenge: help a tadpole grow into a frog, guide Finn through busy roads and the river, or blast asteroids in deep space.</p>
    <h2>Play</h2>
    <div class="games">
      <a class="play" href="Tadpole%20Hop.html">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M12 30c-7 7-5 12 4 8l8-7" fill="none" stroke="#9cf06f" stroke-width="5" stroke-linecap="round"/>
          <ellipse cx="27" cy="27" rx="13" ry="10" fill="#57d65b"/>
          <circle cx="20" cy="17" r="6" fill="#7ee05a"/><circle cx="33" cy="17" r="6" fill="#7ee05a"/>
          <circle cx="21" cy="16" r="2" fill="#17341c"/><circle cx="34" cy="16" r="2" fill="#17341c"/>
          <path d="M23 30q4 3 8 0" fill="none" stroke="#174c26" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        Tadpole Hop
      </a>
      <a class="play" href="frogger.html">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <ellipse cx="24" cy="29" rx="15" ry="11" fill="#57d65b"/>
          <circle cx="15" cy="16" r="8" fill="#57d65b"/><circle cx="33" cy="16" r="8" fill="#57d65b"/>
          <circle cx="16" cy="15" r="3" fill="#fff"/><circle cx="34" cy="15" r="3" fill="#fff"/>
          <circle cx="17" cy="15" r="1.5" fill="#142b1b"/><circle cx="35" cy="15" r="1.5" fill="#142b1b"/>
          <path d="M19 31q5 4 10 0" fill="none" stroke="#183d20" stroke-width="2" stroke-linecap="round"/>
        </svg>
        Finn the Frogger
      </a>
      <a class="play" href="Asteroids.html">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="m24 5 17 38-17-8L7 43z" fill="#7cffb2" stroke="#e8f1ff" stroke-width="3" stroke-linejoin="round"/>
          <path d="m19 34 5 9 5-9" fill="none" stroke="#ffd27a" stroke-width="2.5"/>
        </svg>
        Asteroids
      </a>
    </div>
    <p class="how-to">Use the arrow keys or WASD to hop. On touch screens, swipe or use the on-screen buttons.</p>
  </main>
</body>
</html>
